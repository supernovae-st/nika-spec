name: Conformance

# The static conformance gate · every push/PR runs
#   · tests/core      — Level-1 Core fixtures (parse + validate + DAG + variables + errors)
#   · tests/stdlib    — Stdlib v0.1 static-surface fixtures (canon.yaml-driven names + shapes)
#   · examples/       — every shipped example executed as a conformance input (must be valid)
# via the reference oracle `conformance/runner.py all` (exit non-zero on any failure).
#
# Security note: push/PR/dispatch triggers only · no user-controlled strings
# reach the shell · the runner reads repo files exclusively.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    name: static gate · core + stdlib surface + examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runner deps
        run: pip install --require-hashes -r .github/requirements.txt

      # Ruff lints the Python oracle + projectors (config in ruff.toml · the
      # F-rules catch real defects; the repo's compact E-style is ignored).
      # Fixed command · no user-controlled strings reach the shell.
      - name: Ruff (tooling lint)
        run: ruff check .

      # jq is the oracle's compile check for workflow-supplied jq expressions
      # (nika:jq · fetch.jq · output bindings). Absent, those go UNVERIFIED and
      # the runner warns — so the gate installs it explicitly rather than lean
      # on the runner image shipping it.
      - name: Ensure jq (workflow jq-expression compile check)
        run: jq --version || sudo apt-get update && sudo apt-get install -y jq

      - name: Run the static conformance gate
        run: |
          python conformance/runner.py all
          python conformance/type_core_selftest.py
          python conformance/decision_core_selftest.py
          python conformance/gateway_core_selftest.py
          python conformance/outcome_core_selftest.py
          python conformance/composition_core_selftest.py
          python conformance/trifecta_core_selftest.py
          python conformance/yaml_profile_core_selftest.py
          python conformance/proof_core_selftest.py
          python conformance/projection_core_selftest.py
          python conformance/values_proof.py

      # The second-key gate — a duplicate YAML key silently loses to its
      # twin (three real bites: a swallowed CI step · a doubled permits
      # block · an indent-eaten dependabot groups). *.nika.yaml is exempt
      # (the engine parser refuses duplicates itself · NIKA-PARSE-017) and
      # conformance/tests/ is the harness's torture corpus, not this
      # gate's law. Selftest first: the teeth are proven before they bite.
      - name: YAML duplicate-key gate (selftest + sweep)
        run: |
          python scripts/check-yaml-dup-keys.py --selftest
          python scripts/check-yaml-dup-keys.py

      # The redteam leg (F-P10) · every seeded hostile fixture MUST be
      # refused by the oracle with the law its header names (a seeded
      # attack that passes silently is the worst verdict in the corpus),
      # and the SAF-T coverage TSV must equal its regeneration byte-for-byte
      # with zero in-scope tag uncovered.
      - name: Redteam leg · execution + coverage
        run: |
          python conformance/redteam_core_selftest.py
          python scripts/gen-saf-t-coverage.py --check

      # The committed corpus must be BYTE-exact against type_core.py (a
      # drifted corpus makes the Rust differential judge stale verdicts)
      # and every broken-judge mutation must be killed by it.
      - name: Type corpus · drift + mutation adequacy
        run: |
          python scripts/gen-type-corpus.py --check
          python scripts/gen-type-corpus.py --mutate

      # SSOT gate (SSOT-1 §21-23) · the laws-index/lock projections must equal
      # their regeneration byte-for-byte, and canon.yaml — a GENERATED projection
      # since the C0 flip — must carry its header and equal its own --emit-canon
      # regeneration. A manual edit of a generated surface makes THIS step red
      # (rc=1 lock drift · rc=5 canon divergence). Fixed commands · repo files
      # only · no user-controlled strings reach the shell.
      - name: SSOT gate · lock + laws-index + canon.yaml generated projection
        run: |
          python scripts/ssot-compiler.py --check
          python scripts/ssot-compiler.py --check-canon

      - name: Projection gates · in-repo canon markers + pack manifest + llms files
        run: |
          python scripts/canon-projectors.py --check
          python scripts/showcase-projector.py --check
          python scripts/llms-projector.py --check
          python scripts/ssot-map-projector.py --check
          python scripts/ssot-map-projector.py --selftest
          python scripts/starters-projector.py --check
          python scripts/authoring-projector.py --check
          python scripts/design-projector.py --check

      # Estate observation (E0) · the provenance manifest declares what IS.
      # Advisory while mode is observation — drift warns, never blocks
      # (the website wires the same rung non-blocking · promotion is E2's
      # SEAL move, an operator decision). Fixed command · repo files only.
      # A SEPARATE step on purpose: a line appended under a plain-scalar
      # run: is swallowed as echo text — that exact YAML class disarmed
      # three projector gates here for one push (caught by the refuter).
      - name: Estate observation · provenance manifest (non-blocking)
        run: python scripts/estate.py --check || echo "::warning::estate drift — run scripts/estate.py --write"

      # Governance surfaces cite files by relative link (the certifications
      # matrix · GLOSSARY · CONTRIBUTING) · a deleted target must fail here,
      # never leave the claim standing. Fixed command · repo files only.
      - name: Governance refs · every relative md link resolves
        run: python3 scripts/check-md-refs.py

      # A workflow header's `Run ·` line is a promise the README makes on
      # its behalf — 26 of them taught a dead directory for a day after
      # the flatten (found by a re-proof, not a gate). Fixed command ·
      # repo files only.
      - name: Run-line refs · every header command names a real path
        run: python3 scripts/check-run-lines.py

  mirror:
    name: The estate tool is the shared one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scripts/estate.py is byte-identical to nika-estate at the pinned rev
        run: |
          pin="$(grep -v '^#' ESTATE_PIN | head -1 | tr -d '[:space:]')"
          url="https://raw.githubusercontent.com/supernovae-st/nika-estate/${pin}/scripts/estate.py"
          curl -fsSL "$url" -o /tmp/estate-canonical.py
          if ! cmp -s /tmp/estate-canonical.py scripts/estate.py; then
            echo "::error file=scripts/estate.py::diverges from nika-estate@${pin} — the tool is shared: change it upstream, bump ESTATE_PIN, re-mirror"
            diff -u /tmp/estate-canonical.py scripts/estate.py | head -60
            exit 1
          fi
          echo "✓ scripts/estate.py is byte-identical to nika-estate@${pin}"
