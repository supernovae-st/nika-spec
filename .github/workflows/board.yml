# GitHub planning retired: Linear owns current priorities and tasks.
# This workflow validates historical data and the public timeline offline.
# It has no publisher, source-event trigger, scheduler or Project token.

name: project-archive-audit

on:
  push:
    branches: [main]
    paths:
      - "timeline/**"
      - "project/**"
      - ".github/workflows/board.yml"
  pull_request:
    paths:
      - "timeline/**"
      - "project/**"
      - ".github/workflows/board.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-archive-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned audit environment
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r .github/requirements.txt
      - name: Verify archived projection and live timeline offline
        run: |
          set -euo pipefail
          python3 project/verify.py --offline
          python3 timeline/verify.py --offline
          python3 -m unittest discover -s project -t . -p "test_*.py"
          ruff check project timeline/verify.py
