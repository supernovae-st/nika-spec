nika: config-block
inputs:
  log_level: { type: string, default: "info", required: false }
  region: { type: string, required: false }
tasks:
  note:
    invoke:
      tool: "nika:log"
      args:
        message: "level ${{ inputs.log_level }} in ${{ inputs.region }}"
