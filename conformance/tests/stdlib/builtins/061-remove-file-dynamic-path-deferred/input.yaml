# A caller-supplied path with no default is judged when it resolves.
nika: remove-file-dynamic-path-deferred
inputs:
  target: { type: string, required: true }
permits:
  tools: ["nika:remove_file"]
  fs: { write: ["./out/**"] }
tasks:
  drop:
    invoke:
      tool: "nika:remove_file"
      args: { path: "${{ inputs.target }}" }
