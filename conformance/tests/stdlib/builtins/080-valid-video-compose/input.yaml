# SPDX-License-Identifier: Apache-2.0
# Three stills and two narration clips become one video. Every media input is
# a read the boundary contains, the video a write it contains, and no exec
# grant is needed: the engine starts its encoder itself.
nika: video-compose-valid
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**", "./out/voice/**"]
    write: ["./out/storyboard.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - image: "./out/frames/scene-1.png"
            audio: "./out/voice/scene-1.wav"
            pad_ms: 600
          - image:
              path: "./out/frames/scene-2.png"
              sha256: "bde5666f4a0fab4949c4ca597fce3dd3dbfb55dfd0723f7bc0e01b044c978a29"
            audio:
              path: "./out/voice/scene-2.wav"
              sha256: "458bc7a8b8dab13f9d5bce1e9ec186eae24d7dde1353ed419e4014d3e32130a6"
              duration_ms: 7800
            pad_ms: 600
          - image: "./out/frames/credits.png"
            duration_ms: 3000
        out: "./out/storyboard.mp4"
        size: "1280x720"
        fps: 25
        scale: fit
        background: "#000000"
        quality: standard
        audio_codec: aac
        transition: cut
        metadata: { campaign: "spring" }
        timeout_ms: 600000
