# SPDX-License-Identifier: Apache-2.0
# The metadata's canonical JSON, {"note":"x…x"} with 16374 x, is
# 16385 bytes: one byte over the 16 KiB cap.
nika: video-compose-metadata-over-16-kib
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - { image: "./out/frames/a.png", duration_ms: 2000 }
        out: "./out/a.mp4"
        metadata: { note: "" }
