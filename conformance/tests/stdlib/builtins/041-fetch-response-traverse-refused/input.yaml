# SPDX-License-Identifier: Apache-2.0
nika: fetch-response-traverse-refused
permits:
  tools: [nika:fetch]
  net: {http: [example.com]}
tasks:
  probe:
    invoke:
      tool: nika:fetch
      args:
        url: 'https://example.com/probe'
        response: {accept: [200]}
        traverse: {max_depth: 1}
