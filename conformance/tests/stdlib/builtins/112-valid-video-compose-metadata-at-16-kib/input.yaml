# SPDX-License-Identifier: Apache-2.0
# The metadata's canonical JSON, {"note":"x…x"} with 16373 x, is
# exactly 16384 bytes: the cap is inclusive.
nika: valid-video-compose-metadata-at-16-kib
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - { image: "./out/frames/a.png", duration_ms: 2000 }
        out: "./out/a.mp4"
        metadata: { note: "" }
