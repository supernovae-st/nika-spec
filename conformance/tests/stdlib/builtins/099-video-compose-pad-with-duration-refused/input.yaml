# `pad_ms` adds silence after a clip that sets the length itself. With
# `duration_ms` the length is already fixed, so the pair is refused.
nika: video-compose-pad-with-duration-refused
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**", "./out/voice/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - { image: "./out/frames/a.png", audio: "./out/voice/a.wav", duration_ms: 9000, pad_ms: 600 }
        out: "./out/a.mp4"
