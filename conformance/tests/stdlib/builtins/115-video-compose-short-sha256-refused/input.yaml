# SPDX-License-Identifier: Apache-2.0
# Sixty-three hex digits is not a sha256: the binding to the bytes read
# would be unverifiable, so the reference is refused.
nika: video-compose-short-sha256-refused
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - image:
              path: "./out/frames/a.png"
              sha256: "7f071235805fbf58a2524f77bff76e1391d0d1cfe2f4c190d73054495e05b46"
            duration_ms: 2000
        out: "./out/a.mp4"
