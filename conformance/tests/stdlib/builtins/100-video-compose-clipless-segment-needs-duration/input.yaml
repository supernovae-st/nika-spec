# A still with no clip has no clock of its own: it needs `duration_ms`.
nika: video-compose-clipless-segment-needs-duration
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - { image: "./out/frames/a.png" }
        out: "./out/a.mp4"
