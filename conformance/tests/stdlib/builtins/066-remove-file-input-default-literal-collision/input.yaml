# SPDX-License-Identifier: Apache-2.0
nika: remove-file-input-default-literal-collision
inputs:
  target: { type: string, default: "out/note" }
permits:
  tools: ["nika:write", "nika:remove_file"]
  fs: { write: ["./out/**"] }
tasks:
  put:
    invoke:
      tool: "nika:write"
      args: { path: "./out/note", content: "draft" }
  drop:
    invoke:
      tool: "nika:remove_file"
      args: { path: "${{ inputs.target }}" }
