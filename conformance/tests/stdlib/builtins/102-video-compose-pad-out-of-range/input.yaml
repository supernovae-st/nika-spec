# SPDX-License-Identifier: Apache-2.0
# 10001 ms of silence after a clip is one above the longest pad:
# `pad_ms` is 0..=10000.
nika: video-compose-pad-out-of-range
permits:
  tools: ["nika:video_compose"]
  fs:
    read: ["./out/frames/**", "./out/voice/**"]
    write: ["./out/a.mp4"]
tasks:
  video:
    invoke:
      tool: "nika:video_compose"
      args:
        segments:
          - { image: "./out/frames/a.png", audio: "./out/voice/a.wav", pad_ms: 10001 }
        out: "./out/a.mp4"
