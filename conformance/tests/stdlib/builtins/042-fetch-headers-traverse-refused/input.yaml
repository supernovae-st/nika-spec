# SPDX-License-Identifier: Apache-2.0
nika: fetch-headers-traverse-refused
permits:
  tools: [nika:fetch]
  net: {http: [example.com]}
tasks:
  probe:
    invoke:
      tool: nika:fetch
      args:
        url: 'https://example.com/probe'
        traverse: {max_depth: 1}
        headers: {X-Test: value}
