# The literal path normalizes lexically to ../stale.txt, outside ./out/**.
nika: remove-file-outside-write-boundary
permits:
  tools: ["nika:remove_file"]
  fs: { write: ["./out/**"] }
tasks:
  drop:
    invoke:
      tool: "nika:remove_file"
      args: { path: "./out/../../stale.txt" }
