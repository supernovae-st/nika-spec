# Both spellings normalize to out/note; no edge orders the two tasks.
nika: remove-file-unordered-write-remove
permits:
  tools: ["nika:write", "nika:remove_file"]
  fs: { write: ["./out/**"] }
tasks:
  put:
    invoke:
      tool: "nika:write"
      args: { path: "./out/a/../note", content: "draft" }
  drop:
    invoke:
      tool: "nika:remove_file"
      args: { path: "out//note" }
