# SPDX-License-Identifier: Apache-2.0
nika: fetch-response-dynamic-array
inputs:
  codes: {type: {array: integer}, required: true}
permits:
  tools: [nika:fetch]
  net: {http: [example.com]}
tasks:
  probe:
    invoke:
      tool: nika:fetch
      args:
        url: 'https://example.com/probe'
        mode: raw
        response: {accept: "${{ inputs.codes }}"}
