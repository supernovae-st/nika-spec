nika: hash-021-invalid-algo-with-templated-encoding-refused
inputs:
  encoding:
    type: string
    default: "hex"
permits:
  tools: ["nika:hash"]
tasks:
  digest:
    invoke:
      tool: nika:hash
      args: {"content": "abc", "algo": "md5", "encoding": "${{ inputs.encoding }}"}
