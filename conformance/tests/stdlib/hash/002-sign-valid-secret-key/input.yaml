# SPDX-License-Identifier: Apache-2.0
nika: seal
permits:
  tools: ["nika:hash"]
secrets:
  release_key:
    source: vault
    key: prod/nika/release-ed25519
const:
  release_pub: "MCowBQYDK2VwAyEAexamplepublickeybytesbase64"
tasks:
  sign_manifest:
    invoke:
      tool: nika:hash
      args:
        op: sign
        content: "manifest-bytes"
        key: "${{ secrets.release_key }}"
