nika: seal
permits:
  tools: ["nika:hash"]
secrets:
  release_key:
    source: env
    key: NIKA_RELEASE_ED25519
const:
  release_pub: "MCowBQYDK2VwAyEAexamplepublickeybytesbase64"
tasks:
  digest:
    invoke:
      tool: nika:hash
      args: { algo: blake3, content: "abc", encoding: hex }
