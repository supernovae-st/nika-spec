# SPDX-License-Identifier: Apache-2.0
# Stdlib BEHAVIORAL · the assert pair, boundary half: a condition that
# HOLDS settles success and .output is the TYPED boolean true (never the
# string 'True'). The firing twin is 005 — negative-first reaches the
# behavioral tier: the refusal is the product, this half proves the
# refusal is precise.
nika: v1
workflow:
  id: rt-stdlib-assert-holds
permits: { tools: ["nika:assert"] }
const:
  n: 3
tasks:
  guard:
    invoke:
      tool: "nika:assert"
      args: { condition: "${{ const.n == 3 }}", message: "n must be 3" }
