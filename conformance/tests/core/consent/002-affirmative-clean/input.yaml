nika: t
permits:
  exec: ["git"]
  tools: ["nika:prompt"]
tasks:
  ask:
    invoke:
      tool: "nika:prompt"
      args: { mode: confirm, message: "push?", default: false }
  push:
    with: { go: "${{ tasks.ask.output }}" }
    when: ${{ with.go == true }}
    exec: { command: ["git", "push"] }
