nika: t-schema-file-templated
inputs:
  kind: { type: string, required: true }
permits:
  fs: { read: ["schemas/**"] }
tasks:
  extract:
    infer:
      prompt: "Find the order number in: order 42 shipped"
      schema: { file: "schemas/${{ inputs.kind }}.json" }
