nika: ledger
permits:
  exec: ["./lint.sh", "./audit.sh", "./report.sh"]
tasks:
  leg_lint:
    group: probes
    exec: { command: ["./lint.sh"] }
  leg_flagged_off:
    group: probes
    when: false
    exec: { command: ["./audit.sh"] }
  summary:
    with:
      legs: ${{ group.probes }}
    exec: { command: ["./report.sh"] }
