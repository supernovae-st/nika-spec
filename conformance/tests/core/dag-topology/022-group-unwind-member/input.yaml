# SPDX-License-Identifier: Apache-2.0
nika: v1
workflow:
  id: ledger
permits:
  exec: ["./lint.sh", "./audit.sh", "./report.sh", "./rm-tmp.sh"]
  tools: ["nika:jq"]
tasks:
  leg_lint:
    group: probes
    exec: { command: ["./lint.sh"] }
  cleanup:
    group: probes
    after:
      leg_lint: unwind
    exec: { command: ["./rm-tmp.sh"] }
  summary:
    with:
      legs: ${{ group.probes }}
    exec: { command: ["./report.sh"] }
