nika: translate
const:
  source: "Hello world"
tasks:
  translate:
    for_each:
      items: ["fr", "de", "ja"]
    with:
      locale: ${{ item }}
      n: ${{ index }}
    infer:
      prompt: "Translate to locale '${{ with.locale }}' (#${{ with.n }}) · ${{ const.source }}"
