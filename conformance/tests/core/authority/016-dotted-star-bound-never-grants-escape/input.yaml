# SPDX-License-Identifier: Apache-2.0
nika: v1
workflow:
  id: t-dotted-star-bound-never-grants-escape
permits:
  fs: { read: ["./**"] }
  tools: ["nika:read"]
inputs:
  p: { type: string, default: "../../etc/passwd" }
tasks:
  load:
    invoke:
      tool: nika:read
      args: { path: "${{ inputs.p }}" }
