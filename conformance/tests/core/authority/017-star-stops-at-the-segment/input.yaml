nika: v1
workflow:
  id: t-star-stops-at-the-segment
permits:
  fs: { read: ["./datasets/*.csv"] }
  tools: ["nika:read"]
inputs:
  p: { type: string, default: "datasets/sub/deeper/private.key.csv" }
tasks:
  load:
    invoke:
      tool: nika:read
      args: { path: "${{ inputs.p }}" }
