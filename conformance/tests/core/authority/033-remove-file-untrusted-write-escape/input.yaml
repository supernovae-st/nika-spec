nika: remove-file-untrusted-write-escape
inputs:
  target: { type: string, default: "../../outside/note" }
permits:
  tools: ["nika:remove_file"]
  fs: { write: ["./out/**"] }
tasks:
  drop:
    invoke:
      tool: "nika:remove_file"
      args: { path: "${{ inputs.target }}" }
