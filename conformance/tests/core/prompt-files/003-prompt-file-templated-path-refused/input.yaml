nika: t-prompt-file-templated
inputs:
  which: { type: string, default: "prompts/brief.md" }
permits:
  fs: { read: ["prompts/**"] }   # the prompt text reaches the model · a read inside the boundary
tasks:
  brief:
    infer:
      prompt: { file: "${{ inputs.which }}" }
