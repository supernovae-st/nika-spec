nika: v1
workflow:
  id: t
permits:
  exec: ["git"]
  tools: ["nika:prompt"]
tasks:
  ask:
    invoke:
      tool: "nika:prompt"
      args: { mode: confirm, message: "push?", default: false }
  push:
    after: { ask: success }
    exec: { command: ["git", "push"] }
