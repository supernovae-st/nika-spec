nika: v1
workflow:
  id: core-secret-file
secrets:
  signing_pem:
    source: file
    path: ~/.keys/signing.pem
    egress: [{ to: "exec" }]
permits:
  exec: ["./sign.sh"]
tasks:
  sign:
    exec: { command: ["./sign.sh"], env: { PEM: "${{ secrets.signing_pem }}" } }
