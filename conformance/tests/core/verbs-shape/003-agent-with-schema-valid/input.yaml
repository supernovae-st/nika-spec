# SPDX-License-Identifier: Apache-2.0
nika: review
inputs:
  pr: { type: string, required: true }
permits:
  tools: ["nika:done"]
tasks:
  review:
    agent:
      prompt: "Review ${{ inputs.pr }}"
      tools: ["nika:done"]
      schema:
        type: object
        required: [findings]
        properties:
          findings: { type: array }
