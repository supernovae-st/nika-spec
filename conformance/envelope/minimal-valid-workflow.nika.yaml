# Expected: exit 0 — offline jq→write chain; minimal valid workflow (an effect declares its boundary · F-O8).
nika: f01-builtins-sink

# Offline foundation smoke — exercises the run loop with zero API:
# nika:jq (typed structured output) -> binding -> nika:write (serialize) sink.
permits:
  fs:
    write: ["./out/f01.json"]
  exec: false
  tools: ["nika:jq", "nika:write"]

tasks:
  compute:
    invoke:
      tool: nika:jq
      args:
        input: { items: [1, 2, 3, 4], label: "sum" }
        expression: "{ total: (.items | add), count: (.items | length), label: .label }"

  sink:
    with:
      compute: ${{ tasks.compute.output }}
    invoke:
      tool: nika:write
      args:
        path: ./out/f01.json
        content: ${{ with.compute }}
