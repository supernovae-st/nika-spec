# Expected: NIKA-EXEC-001 at RUN. Producer fails by design; BOTH unwind markers present (cleanup runs on success AND failure paths).
nika: v1
workflow:
  id: onfinally-both-paths
# SPEC 03 §unwind: ALWAYS runs for a STARTED producer (success AND failure path).
# Cleanup errors are LOGGED but DO NOT propagate (producer status = main verb outcome only).
# ok_task succeeds → its unwind task writes 18_finally_ok.json.
# fail_task fails → its unwind task STILL writes 18_finally_fail.json (before error propagates).
# Markers: BOTH 18_finally_ok.json AND 18_finally_fail.json present. Workflow exit!=0 (fail_task).
permits:
  fs:
    write: ["./out/ctrlflow/18_finally_fail.json", "./out/ctrlflow/18_finally_ok.json", "./out/ctrlflow/18_ok.json"]
  exec: ["exit"]
  tools: ["nika:write"]

tasks:
  ok_task:
    invoke:
      tool: nika:write
      args: { path: "./out/ctrlflow/18_ok.json", content: "ok" }
  ok_cleanup:
    after: { ok_task: unwind }
    invoke:
      tool: nika:write
      args: { path: "./out/ctrlflow/18_finally_ok.json", content: "finally-ok" }
  fail_task:
    exec:
      command: ["exit", "1"]
  fail_cleanup:
    after: { fail_task: unwind }
    invoke:
      tool: nika:write
      args: { path: "./out/ctrlflow/18_finally_fail.json", content: "finally-fail" }
