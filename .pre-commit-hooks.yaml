# pre-commit hooks for Nika workflows · https://pre-commit.com
#
# The maintained `nika-check` hook ships with the engine. Pin its release:
#
#   repos:
#     - repo: https://github.com/supernovae-st/nika
#       rev: v0.123.0
#       hooks:
#         - id: nika-check
#
# This manifest adds `nika-check-strict`. The spec repository carries no
# release tag, so pin a full commit SHA of this repository that holds the
# hook (pre-commit accepts a commit SHA as `rev:`):
#
#   repos:
#     - repo: https://github.com/supernovae-st/nika-spec
#       rev: <full commit SHA>
#       hooks:
#         - id: nika-check-strict
#
# Requires the `nika` binary on PATH (https://nika.sh/install).
- id: nika-check
  name: nika check (validate Nika workflows)
  description: Validate .nika workflows against the Nika v1 language (schema + DAG + bindings).
  entry: nika check
  language: system
  files: '\.nika$'
- id: nika-check-strict
  name: nika check --native-strict (native-first hints fail too)
  description: Validate .nika workflows and fail while a native-first hint remains (a builtin covers what a task runs a program for).
  entry: nika check --native-strict
  language: system
  files: '\.nika$'
