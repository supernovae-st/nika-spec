# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# X07 · reference · the requested send is present, and the boundary grants exactly what it needs.
#
#   [summarise]──▶[send]
#    infer          nika:notify → the team webhook
#
# The request was "summarise the incident and post it to the team channel". The
# post is the point: it stays in the candidate, its authority is requested by
# name, and nothing wider is asked for.
nika: x07-explicit-connector-grant
model: mock/echo

inputs:
  incident:
    type: string
    required: true

secrets:
  webhook:
    source: env
    key: TEAM_WEBHOOK_URL
    egress:
      - to: "nika:notify"
        host_from_self: true

permits:
  tools: ["nika:notify"]
  net:
    http: ["hooks.slack.test"]

tasks:
  summarise:
    infer:
      max_tokens: 400
      prompt: "Summarise this incident in three sentences for the on-call team. Incident: ${{ inputs.incident }}"
      schema:
        type: object
        additionalProperties: false
        required: [summary]
        properties:
          summary: { type: string, minLength: 1 }

  send:
    with:
      summary: ${{ tasks.summarise.output.summary }}
    invoke:
      tool: "nika:notify"
      args:
        channel: webhook
        target: "${{ secrets.webhook }}"
        message: "${{ with.summary }}"
        severity: info

# `send` consumed the webhook secret, so nothing about it is exposed here: a
# secret-tainted record at the workflow boundary is refused (NIKA-SEC-007).
outputs:
  summary: ${{ tasks.summarise.output.summary }}
