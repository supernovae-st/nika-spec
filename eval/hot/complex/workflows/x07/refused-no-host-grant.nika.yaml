# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# X07 · REFUSED · the send is present and no host is granted.
# The engine check refuses it (NIKA-SEC-004). This is the violation half of the
# authority pair; `reference.nika.yaml` is the boundary success.
nika: x07-refused-no-host-grant
model: mock/echo

inputs:
  incident:
    type: string
    required: true

secrets:
  webhook:
    source: env
    key: TEAM_WEBHOOK_URL
    egress:
      - to: "nika:notify"
        host_from_self: true

permits:
  tools: ["nika:notify"]

tasks:
  summarise:
    infer:
      max_tokens: 400
      prompt: "Summarise this incident in three sentences for the on-call team. Incident: ${{ inputs.incident }}"
      schema:
        type: object
        additionalProperties: false
        required: [summary]
        properties:
          summary: { type: string, minLength: 1 }

  send:
    with:
      summary: ${{ tasks.summarise.output.summary }}
    invoke:
      tool: "nika:notify"
      args:
        channel: webhook
        target: "${{ secrets.webhook }}"
        message: "${{ with.summary }}"
        severity: info

# `send` consumed the webhook secret, so nothing about it is exposed here: a
# secret-tainted record at the workflow boundary is refused (NIKA-SEC-007).
outputs:
  summary: ${{ tasks.summarise.output.summary }}
