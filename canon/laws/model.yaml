    inputs:
      - registry: surface
        id: run_reasoning
        role: required
    premises:
      - operator: conforms_to
        operands:
          - registry: surface
            id: run_reasoning
          - registry: ir
            id: run_reasoning_shape
        quantifier: forall
    conclusion:
      verdict: admit
    canonicalization:
      order_sensitive: false
      normalization: ["none"]
    judgment:
      generated_facts:
        - registry: ir
          id: run_reasoning_shape
      independent_judgment: true
    domain_payload:
      kind: grammar
      position: run.reasoning
      field_rules:
        - field: effort
          cardinality: required
          value_shape:
            registry: ir
            id: native_effort_value
    diagnostics: []
    fixtures:
      - conformance/tests/core/envelope/033-run-access-acp-effort-passes
      - conformance/tests/core/envelope/034-run-access-seeded-virtual-passes
