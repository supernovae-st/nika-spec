  - id: LAW-CONF-0501
    slug: model/declared-selection-honored-or-refused-before-inference
    status: reserved
    owner: spec
    domain: CONF
    title: "Une sélection déclarée est honorée exactement — route, protocole, modèle, effort natif appliqués avant le premier prompt — ou refusée avant toute inférence · fallback: none ne substitue jamais"
    prose_projection:
      chapters: ["01-envelope"]
      text: "Le contrat Runtime de run.access / run.reasoning : le fichier seul sélectionne la route (aucune option de lancement supplémentaire · une option contradictoire refuse avant inférence) · le moteur découvre l'offre de la route (handshake ACP, requête de capacités : découverte, pas inférence) puis applique le modèle et l'effort par les propres méthodes de sélection de la session AVANT le premier prompt, juge l'effort contre les options offertes APRÈS la sélection du modèle, relit la configuration là où la route l'expose et refuse une relecture qui ne tient pas la sélection · une session qui ne fait qu'accuser réception du modèle produit une preuve accepted_request, jamais configured ni servi, et un effort qu'elle ne sait pas appliquer refuse · une sélection impossible (route inconnue ou indisponible · protocole non parlé · modèle non servi · effort non offert) refuse AVANT toute requête d'inférence — zéro prompt, zéro appel d'API, zéro CLI directe — avec un diagnostic nommant le champ, la valeur demandée et les choix disponibles · fallback: none (aussi le sens d'un fallback omis) : jamais d'autre route, protocole, modèle ou effort, ni avant l'admission ni pendant le run, même si une clé d'API ou une CLI directe est configurée · une CLI directe ne satisfait jamais acp · pour infer: la rencontre infer-grade de 02 tient toujours · quatre faits séparés : demandé, transmis, configuré, répondant attesté ou absent · la sélection déclarée entre dans l'identité de chaque tâche modèle : une reprise ne réutilise jamais un résultat obtenu sous une autre sélection."
    inputs:
      - registry: ir
        id: declared_access_selection
        role: required
      - registry: ir
        id: route_advertised_options
        role: ceiling
    premises:
      - operator: subset_of
        operands:
          - registry: ir
            id: declared_access_selection
          - registry: ir
            id: route_advertised_options
        quantifier: forall
    conclusion:
      verdict: admit
    canonicalization:
      order_sensitive: false
      normalization: ["none"]
    judgment:
      generated_facts:
        - registry: ir
          id: route_advertised_options
      independent_judgment: true
    domain_payload:
      kind: conformance
      constraint: polarity_declared
      subject:
        registry: ir
        id: access_selection_runtime_contract
    diagnostics: []
    fixtures:
      - conformance/tests/runtime/access-harness/003-file-acp-selection-configured-before-prompt
      - conformance/tests/runtime/access-harness/004-file-acp-ack-is-not-configuration
      - conformance/tests/runtime/access-harness/005-file-api-attested-responder-recorded
      - conformance/tests/runtime/access-harness/006-file-acp-effort-judged-after-model-selection
      - conformance/tests/runtime/access-harness/007-file-api-selection-honored
    negative_fixtures:
      - conformance/tests/runtime/access-harness/008-file-acp-unsupported-effort-refused-before-prompt
      - conformance/tests/runtime/access-harness/009-file-acp-effort-refused-after-model-selection
      - conformance/tests/runtime/access-harness/010-file-acp-unadvertised-model-refused-before-prompt
      - conformance/tests/runtime/access-harness/011-file-acp-unconfirmed-readback-refused
      - conformance/tests/runtime/access-harness/012-file-acp-unavailable-not-substituted
      - conformance/tests/runtime/access-harness/013-file-acp-session-death-not-rerouted
      - conformance/tests/runtime/access-harness/014-file-acp-infer-without-one-shot-refused
      - conformance/tests/runtime/access-harness/015-launch-access-contradicting-file-refused
      - conformance/tests/runtime/access-harness/016-file-unknown-route-refused
      - conformance/tests/runtime/access-harness/017-file-route-protocol-not-spoken-refused
    projections: ["prose:01-envelope", "cli:run", "sdk", "docs"]
    implementation_surfaces:
      - engine:nika-providers
      - engine:nika-harness
      - engine:nika-runtime
      - conformance:access-harness-suite
    introduced_in: C2
    proof_obligations:
      - "Chaque fixture runtime déclare son monde de routes (access_routes : pair ACP scripté, CLI directe, clé d'API — jamais une découverte de l'hôte) et sépare le reçu du run (receipt) de l'observation indépendante de l'adaptateur (observed : prompts ACP, requêtes d'inférence API, invocations CLI). conformance/tests/test_access_contract.py dérive le verdict de chaque fixture de ses propres prémisses et prouve par mutation qu'un mensonge plausible (effort traduit, API substituée, accusé de réception promu en configuration) est attrapé."
      - "Aucun adaptateur de commande qualifié n'exécute encore cette extension : chaque fixture est UNSUPPORTED, jamais un accord. Les refus enregistrent le code que le moteur de référence émet dans sa famille d'accès NIKA-18xx (codes numériques nus hors du motif diagCode du registre, d'où diagnostics: [] ici) ; aucun code n'est inventé par la spec."
      - "DETTE déclarée (jamais fermée en silence) : la phrase « une reprise ne réutilise jamais un résultat obtenu sous une autre sélection » n'a pas encore de fixture exécutable — une fixture de la porte resume exige un journal qui enregistre la sélection, dont le format appartient au moteur. Elle est due avec ce format."
