  # ─────────── Contrat d'accès ratifié · run.access · run.reasoning (pré-freeze) ───────────
  #
  # Changement normatif pré-freeze (CONTRIBUTING : PR directe contre spec/ avec ses
  # fixtures · la porte NEP reste dormante jusqu'au pré-freeze v1). Le contrat sépare
  # l'identité du modèle (model:, LAW-SURFACE-0501 inchangée) de la route
  # (run.access.via), du protocole (run.access.protocol), du fallback
  # (run.access.fallback) et de l'effort natif (run.reasoning.effort). Prose :
  # spec/01-envelope.md §run. Schema : schemas/workflow.schema.json properties.run.
  # Le couplage entropy × clock reste la loi LAW-TEMPORAL-0435, intacte.

  - id: LAW-SURFACE-0503
    slug: model/access-and-effort-are-run-declarations
    status: active
    owner: spec
    domain: SURFACE
    title: "Route, protocole, fallback et effort natif sont des déclarations de run:, distinctes de l'identité du modèle · protocole api | acp · aucune dixième clé d'enveloppe · aucune clé par tâche"
    prose_projection:
      chapters: ["01-envelope"]
      text: "model: reste la string <provider>/<name> (LAW-SURFACE-0501) et dit QUEL modèle répond · run.access dit COMMENT le run l'atteint (via: la route · protocol: api | acp · fallback: none) · run.reasoning.effort dit quel effort NATIF lui est demandé. Une épellation par sens : access et reasoning vivent sous run: — l'enveloppe garde ses neuf clés et aucune clé access:/reasoning: n'existe au niveau tâche (un run, une route, comme un run, une horloge) · le vocabulaire de protocole est exactement api | acp : « native » n'est pas une troisième famille d'accès (une CLI directe est une implémentation d'adaptateur, jamais un protocole sélectionnable, et ne satisfait jamais acp) · la spec ne fige aucun catalogue de routes, de modèles ni d'efforts · les identifiants, comptes et facturation d'une route restent dans sa propre configuration, jamais dans le fichier."
    inputs:
      - registry: surface
        id: run_access
        role: required
      - registry: surface
        id: run_reasoning
        role: required
      - registry: ir
        id: access_protocol_vocabulary
        role: ceiling
    premises:
      - operator: member_of
        operands:
          - registry: surface
            id: run_access
          - registry: ir
            id: run_declaration_keys
        quantifier: forall
      - operator: member_of
        operands:
          - registry: surface
            id: run_reasoning
          - registry: ir
            id: run_declaration_keys
        quantifier: forall
      - operator: subset_of
        operands:
          - registry: ir
            id: access_protocol_values
          - registry: ir
            id: access_protocol_vocabulary
        quantifier: forall
    conclusion:
      verdict: admit
    canonicalization:
      order_sensitive: false
      normalization: ["none"]
    judgment:
      generated_facts:
        - registry: ir
          id: access_protocol_vocabulary
      independent_judgment: true
    domain_payload:
      kind: surface
      constraint: one_spelling_per_meaning
      subject:
        registry: surface
        id: run_access
    diagnostics: []
    fixtures:
      - conformance/tests/core/envelope/033-run-access-acp-effort-passes
      - conformance/tests/core/envelope/036-run-reasoning-effort-alone-passes
    negative_fixtures:
      - conformance/tests/core/envelope/046-run-access-protocol-native-refused
      - conformance/tests/core/envelope/049-access-top-level-key-refused
      - conformance/tests/core/envelope/050-task-access-key-refused
    projections: ["prose:01-envelope", "schema", "cli:check", "lsp", "mcp", "sdk"]
    implementation_surfaces:
      - engine:nika-vocab
      - engine:nika-schema
      - reference:runner.py
      - cli:nika-check
      - conformance:envelope-suite
    introduced_in: C2
    proof_obligations:
      - "Le schema publie run.access et run.reasoning sous properties.run (additionalProperties: false) et nulle part ailleurs : une clé access: en tête d'enveloppe (049) ou au niveau tâche (050) refuse NIKA-PARSE · validation_error, la classe générique opérante (aucun code numéroté dédié n'est inventé ici)."
      - "protocol: native refuse (046) : l'énumération publique est exactement api | acp. Le transport réel d'une ancienne exécution CLI directe reste nommé dans ses propres reçus ; il ne devient pas une valeur de sélection."
    closure_gates:
      - fixture-parity
      - run-access-surface-closed

  - id: LAW-GRAMMAR-0502
    slug: model/run-access-closed-literal-shape
    status: active
    owner: spec
    domain: GRAMMAR
    title: "run.access est un ensemble fermé {via, protocol, fallback} · chaque clé optionnelle, la déclaration non vide · via kebab-case non vide · protocol api | acp · fallback none · valeurs littérales"
    prose_projection:
      chapters: ["01-envelope"]
      text: "La forme de run.access est TOUT son contrat statique : un mapping fermé {via, protocol, fallback} (une clé inconnue refuse dans les deux modes de parse, comme permits:) · chaque clé est optionnelle mais access: {} ne sélectionne rien et refuse · via est un id de route kebab-case non vide (une application d'agents ou un id de fournisseur API · ensemble ouvert jugé par le registre de routes du moteur) · protocol est l'enum fermée api | acp · fallback est l'enum fermée none — omis, il vaut none dès que access: est déclaré (une sélection explicite est exacte · les alternatives déclarées ne sont pas spécifiées, une valeur future est additive) · aucune valeur n'est un template ${{ }} (la sélection est résolue avant la première tâche, depuis le fichier seul) · protocol omis : la route se connecte comme avant la déclaration. Violation = NIKA-PARSE · validation_error. L'existence de la route, le protocole qu'elle parle et le modèle qu'elle sert ne sont PAS jugés ici (LAW-CONF-0501)."
    inputs:
      - registry: surface
        id: run_access
        role: required
    premises:
      - operator: conforms_to
        operands:
          - registry: surface
            id: run_access
          - registry: ir
            id: run_access_shape
        quantifier: forall
    conclusion:
      verdict: admit
    canonicalization:
      order_sensitive: false
      normalization: ["none"]
    judgment:
      generated_facts:
        - registry: ir
          id: run_access_shape
      independent_judgment: true
    domain_payload:
      kind: grammar
      position: run.access
      field_rules:
        - field: via
          cardinality: optional
          value_shape:
            registry: ir
            id: access_route_id_form
        - field: protocol
          cardinality: optional
          value_shape:
            registry: ir
            id: access_protocol_vocabulary
        - field: fallback
          cardinality: optional
          value_shape:
            registry: ir
            id: access_fallback_vocabulary
    diagnostics: []
    fixtures:
      - conformance/tests/core/envelope/033-run-access-acp-effort-passes
      - conformance/tests/core/envelope/034-run-access-seeded-virtual-passes
      - conformance/tests/core/envelope/037-run-access-protocol-alone-passes
    negative_fixtures:
      - conformance/tests/core/envelope/038-run-access-empty-refused
      - conformance/tests/core/envelope/039-run-access-unknown-key-refused
      - conformance/tests/core/envelope/041-run-access-not-a-mapping-refused
      - conformance/tests/core/envelope/043-run-access-via-empty-refused
      - conformance/tests/core/envelope/046-run-access-protocol-native-refused
      - conformance/tests/core/envelope/047-run-access-fallback-unknown-refused
    projections: ["prose:01-envelope", "schema", "cli:check", "lsp", "mcp", "sdk"]
    implementation_surfaces:
      - engine:nika-vocab
      - engine:nika-schema
      - reference:runner.py
      - cli:nika-check
      - conformance:envelope-suite
    introduced_in: C2
    proof_obligations:
      - "Chaque fixture négative isole une seule violation de forme (mapping vide · clé inconnue · scalaire au lieu d'un mapping · via vide · protocol hors enum · fallback hors enum) et le verdict de l'oracle de référence nomme ce chemin sous run.access ; sous le schema de base (clé fermée {entropy, clock}) les fixtures positives refusaient — le patch est donc nécessaire, pas cosmétique."
      - "La coexistence avec entropy/clock (034) est légale et le couplage reste jugé à l'identique avec access: présent (035 · NIKA-PARSE-026 · LAW-TEMPORAL-0435)."
    closure_gates:
      - fixture-parity
      - run-access-shape-closed

  - id: LAW-GRAMMAR-0503
    slug: model/run-reasoning-native-effort-shape
    status: active
    owner: spec
    domain: GRAMMAR
    title: "run.reasoning est un ensemble fermé {effort} · effort requis · la valeur native exacte : string non vide, sans espace autour, littérale · aucune échelle universelle"
    prose_projection:
      chapters: ["01-envelope"]
