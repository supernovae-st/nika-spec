# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 11 · Declassify — the one door through the taint.
#
# A permit-relevant argument fed by an UNTRUSTED value (`inputs.*` ·
# `config.*` · anything fetched) trips the parameterisation taint: the
# check refuses with `NIKA-AUTH-008` even when today's value sits inside
# the bound, because tomorrow's caller may aim elsewhere. The spec offers
# exactly one door — `declassify:` on the task, with a reviewable
# `because:` (spec/10-authority.md · "The only door is the authored one").
#
# Demonstrates ·
#   - the taint, measured · without the `declassify:` below this file is
#     ✖ NIKA-AUTH-008 at check (untrusted `inputs.path` reaches a
#     `nika:read` path argument)
#   - `declassify:` · task-level, `from:` a dotted binding · `to: trusted`
#     (the only value v1 knows) · `because:` non-empty, the review record
#   - what the door is NOT · it lifts the TAINT law only, never the
#     boundary — a path outside the bound still dies `NIKA-SEC-004` at run,
#     declassify or not (spec/10-authority.md · "never a permit bypass")
#   - a wall with no door at all · a permit BOUND can never interpolate
#     (`NIKA-AUTH-007` · a bound is a literal you can read)
#
# Run · nika run examples/11-declassify-the-door.nika.yaml
#   another vendor file · --var path=examples/fixtures/inventory-q3.csv

nika: v1
workflow:
  id: declassify-the-door

permits:
  tools: ["nika:jq", "nika:read"]
  fs:
    # The bound is the DOMAIN the operator grants: any fixture csv, one
    # path segment, nothing nested. `*` never crosses `/` — a caller aiming
    # at `fixtures/deep/x.csv` or `../secrets.csv` is refused by the
    # boundary itself, before the taint question even comes up.
    read: ["examples/fixtures/*.csv"]

inputs:
  path:
    type: string
    default: "examples/fixtures/inventory-q3.csv"
    required: true
    description: "WHICH vendor csv to load · must sit inside the fs.read bound"

tasks:
  load:
    invoke:
      tool: "nika:read"
      args:
        path: "${{ inputs.path }}"
    # The door. `from:` names the exact tainted binding; `because:` is the
    # sentence a reviewer holds you to. What it buys: the taint re-gate is
    # lifted for THIS binding on THIS task. What it does not buy: the
    # boundary above still confines every value the input can take.
    declassify:
      - from: inputs.path
        to: trusted
        because: "the caller picks WHICH fixture csv, never an arbitrary path — the one-segment *.csv bound confines every value this input can take, and the run refuses anything outside it"

  shape:
    with:
      raw: ${{ tasks.load.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.raw }}"
        expression: '{rows: (split("\n") | map(select(. != "")) | length - 1)}'

outputs:
  summary:
    value: ${{ tasks.shape.output }}
    description: "How many data rows the vendor file carries (header excluded)"
